name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'                # 推送 v 开头的标签时触发
  workflow_dispatch:         # 允许手动触发

jobs:
  build:
    runs-on: windows-latest  # 使用 Windows 虚拟机

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download FFmpeg static build
        shell: pwsh
        run: |
          # 从 BtbN 的 GitHub 仓库下载 Windows 64位 ffmpeg 压缩包
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_temp
          # 找到解压后的 bin 目录（通常只有一个子目录）
          $ffmpeg_dir = Get-ChildItem -Path ffmpeg_temp -Directory | Select-Object -First 1
          $bin_dir = Join-Path $ffmpeg_dir.FullName "bin"
          # 复制 ffmpeg.exe 和 ffprobe.exe 到项目根目录，方便 PyInstaller 添加
          Copy-Item "$bin_dir\ffmpeg.exe" .
          Copy-Item "$bin_dir\ffprobe.exe" .

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            --name "VideoSplitter" `
            --icon "icon.ico" `   # 如果没有 icon.ico 就删除这一行
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoSplitter-Windows
          path: dist/VideoSplitter.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoSplitter.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
