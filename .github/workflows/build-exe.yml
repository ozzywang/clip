name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'                # 推送 v 开头的标签时触发构建
  workflow_dispatch:         # 允许在 Actions 页面手动触发

jobs:
  build:
    runs-on: windows-latest  # 使用 Windows 虚拟机

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Download FFmpeg static build
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_temp
          $ffmpeg_dir = Get-ChildItem -Path ffmpeg_temp -Directory | Select-Object -First 1
          $bin_dir = Join-Path $ffmpeg_dir.FullName "bin"
          Copy-Item "$bin_dir\ffmpeg.exe" .
          Copy-Item "$bin_dir\ffprobe.exe" .

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            --name "VideoSplitter" `
            main.py
          # 如果你有图标文件 icon.ico，请将上面最后一行替换为：
          # pyinstaller --onefile --windowed `
          #   --add-binary "ffmpeg.exe;." `
          #   --add-binary "ffprobe.exe;." `
          #   --name "VideoSplitter" `
          #   --icon "icon.ico" `
          #   main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoSplitter-Windows
          path: dist/VideoSplitter.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoSplitter.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
